<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Online Courses</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="{% url 'onlinecourse:index' %}">Online Course Platform</a>
            <div class="navbar-nav ml-auto">
                {% if user.is_authenticated %}
                <span class="nav-item nav-link text-white">Welcome, {{ user.username }}</span>
                <a class="nav-item nav-link" href="{% url 'onlinecourse:logout' %}">Logout</a>
                {% else %}
                <a class="nav-item nav-link" href="{% url 'onlinecourse:login' %}">Login</a>
                {% endif %}
            </div>
        </div>
    </nav>
    <div class="container my-5">
        <h1 class="mb-4 text-primary font-weight-bold">Available Online Courses</h1>
        <div class="row">
            {% for course in course_list %}
            <div class="col-md-4 mb-4">
                <div class="card h-100 shadow-sm">
                    <div class="card-body">
                        <h5 class="card-title text-primary font-weight-bold">{{ course.name }}</h5>
                        <p class="card-text text-secondary">{{ course.description }}</p>
                        <a href="{% url 'onlinecourse:course_details' course.id %}" class="btn btn-outline-primary">View Course</a>
                    </div>
                </div>
            </div>
            {% empty %}
            <p class="col-12 text-muted">No courses available.</p>
            {% endfor %}
        </div>
    </div>
</body>
</html>
